name: cd

on:
  push:
    branches: [main]

jobs:
    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        permissions:
          contents: 'read'
          id-token: 'write'

        steps:
        - name: Checkout repository
          uses: actions/checkout@v6

        - name: Set up Go
          uses: actions/setup-go@v6
          with:
            go-version: "1.27.1"
        
        - name: Build app
          run: ./scripts/buildprod.sh

        - id: 'auth'
          uses: 'google-github-actions/auth@v2'
          with:
            workload_identity_provider: 'projects/1002485784327/locations/global/workloadIdentityPools/github/providers/my-repo'
            service_account: 'cloud-run-deployer@notely-512218.iam.gserviceaccount.com'

        - name: 'Set up Cloud SDK'
          uses: 'google-github-actions/setup-gcloud@v2'
          with:
            version: '>= 363.0.0'
        - name: 'Use gcloud CLI'
          run: 'gcloud info'
        - name: 'Build and push docker image'
          run: 'gcloud builds submit --tag us-central1-docker.pkg.dev/notely-512218/notely-ar-repo/notely:latest .'
        - name: Deploy to Cloud Run
          run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-512218/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-512218 --max-instances=4


